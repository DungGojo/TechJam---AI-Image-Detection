[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-aigc-detector"
version = "0.1.0"
description = "Real vs AI-generated image detection: three detectors fused into one verdict."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.9",
    "transformers>=4.40",
    "huggingface_hub>=0.25",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml",
    "tqdm",
    "scipy>=1.11",
    "xgboost>=2.1",
    "nvidia-cudnn-cu12; platform_system == 'Linux'",
    "nvidia-cublas-cu12; platform_system == 'Linux'",
    "nvidia-cuda-nvrtc-cu12; platform_system == 'Linux'",
    "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "datasets>=3.0",
    "modelscope>=1.18",
]

[project.scripts]
classify = "workflows.classify:main"

[tool.setuptools.packages.find]
include = ["data_pipeline*", "modeling*", "evaluation*", "workflows*", "scripts*"]
