# Copy to configs/ensemble.yaml after training and adjust checkpoint names.
experts:
  dinov3:
    model: dinov3
    checkpoint: checkpoints/dinov3/notebook_dinov3/best_robust.pt
  community_forensics:
    model: community_forensics

fusion:
  mode: weighted
  weights:
    dinov3: 0.7
    community_forensics: 0.3

# Replace with `calibration: checkpoints/fusion/temperature.json` after fitting T.
calibration:
  temperature: 1.0
